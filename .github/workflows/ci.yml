name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  # Sysroot, toolchain and prebuilt downloads (ripgrep and others) go through the GitHub API.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    name: Build, smoke test and package (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbfile-dev libsecret-1-dev libkrb5-dev xvfb fakeroot rpm dpkg-dev python-is-python3
          # Electron's renderer sandbox needs unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Prepare the fork
        run: node scripts/fork-prepare.mjs

      # Native modules are compiled the way upstream does it: Chromium's clang against a glibc 2.28 sysroot, so the
      # packages run on the same distributions as VS Code instead of only on this runner's glibc.
      - name: Install upstream dependencies
        working-directory: .upstream/build
        env:
          VSCODE_ARCH: x64
          npm_config_arch: x64
        run: |
          npm ci --prefix build --no-audit --no-fund
          source build/azure-pipelines/linux/setup-env.sh
          node build/npm/preinstall.ts
          npm ci --no-audit --no-fund

      - name: Build
        working-directory: .upstream/build
        env:
          BUILD_SOURCEVERSION: ${{ github.sha }}
        run: npm run gulp vscode-linux-x64-min

      - name: Smoke test
        run: |
          mkdir -p build
          git init -q -b main /tmp/smoke && git -C /tmp/smoke -c user.name=ci -c user.email=ci@minv.invalid commit -q --allow-empty -m init
          node scripts/fork-capture.mjs /tmp/smoke build/smoke.png --app=.upstream/VSCode-linux-x64/minv --wait=8000 \
            --eval="document.querySelector('.statusbar')?.innerText" | tee build/smoke.log
          grep -q '^Workbench painted' build/smoke.log
          grep -q 'eval:.*main' build/smoke.log

      - name: Install appimagetool
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c
          chmod +x /tmp/appimagetool

      - name: Package
        env:
          APPIMAGETOOL: /tmp/appimagetool
          # The runner has no FUSE; run AppImages (appimagetool and Minv's) by extracting them.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: node scripts/fork-package.mjs

      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          node scripts/fork-capture.mjs /tmp/smoke build/smoke-appimage.png --app=build/release/minv-linux-x64.AppImage --wait=5000 \
            --eval="document.querySelector('.statusbar')?.innerText" | tee build/smoke-appimage.log
          grep -q 'eval:.*main' build/smoke-appimage.log

      - name: Check glibc floor
        run: |
          # Fails if anything shipped needs a newer glibc than the 2.28 sysroot provides.
          floor=$( { find .upstream/VSCode-linux-x64 -name '*.node'; echo .upstream/VSCode-linux-x64/minv; } | xargs objdump -T \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Highest glibc symbol: ${floor}"
          [ "$(printf '%s\n' "${floor#GLIBC_}" 2.28 | sort -V | tail -1)" = 2.28 ]

      - name: Install and smoke test the .deb
        run: |
          sudo apt-get install -y -qq ./build/release/minv-linux-x64.deb
          dpkg -s minv | grep -E '^(Version|Depends)'
          node scripts/fork-capture.mjs /tmp/smoke build/smoke-deb.png --app=/usr/share/minv/minv --wait=5000 \
            --eval="document.querySelector('.statusbar')?.innerText" | tee build/smoke-deb.log
          grep -q 'eval:.*main' build/smoke-deb.log
          sudo apt-get remove -y -qq minv

      - name: Install the .rpm on Fedora
        run: |
          docker run --rm -v "$PWD/build/release:/release:ro" fedora:latest \
            bash -c 'dnf install -y -q /release/minv-linux-x64.rpm && rpm -q minv && test -x /usr/bin/minv'

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: build/smoke*
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: minv-linux-x64
          path: build/release/*
          if-no-files-found: error

  windows:
    name: Build, package and install test (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      # Upstream's patches and sources must stay LF for the fork's patches to apply.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json

      - name: Prepare the fork
        run: node scripts/fork-prepare.mjs

      - name: Install upstream dependencies
        working-directory: .upstream/build
        env:
          npm_config_arch: x64
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: .upstream/build
        env:
          BUILD_SOURCEVERSION: ${{ github.sha }}
        run: npm run gulp vscode-win32-x64-min

      - name: Package
        run: node scripts/fork-package.mjs

      - name: Install and smoke test the installer
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath build\release\minv-win32-x64-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/MERGETASKS=!runcode'
          $app = "$env:LOCALAPPDATA\Programs\Minv\Minv.exe"
          if (-not (Test-Path $app)) { throw "Minv.exe was not installed" }
          git init -q -b main "$env:RUNNER_TEMP\smoke"
          git -C "$env:RUNNER_TEMP\smoke" -c user.name=ci -c user.email=ci@minv.invalid commit -q --allow-empty -m init
          node scripts/fork-capture.mjs "$env:RUNNER_TEMP\smoke" build\smoke-win.png "--app=$app" --wait=8000 `
            "--eval=document.querySelector('.statusbar')?.innerText" | Tee-Object build\smoke-win.log
          if (-not (Select-String -Quiet -Path build\smoke-win.log -Pattern '^Workbench painted')) { throw "The workbench did not paint" }
          if (-not (Select-String -Quiet -Path build\smoke-win.log -Pattern 'eval:.*main')) { throw "Git status did not show in the status bar" }

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-win
          path: build/smoke-win*
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: minv-win32-x64
          path: build/release/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: minv-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#v}
          prerelease=""
          case "$version" in 0.*|*-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<'EOF'
          ## Install

          | Distribution | Download | Install |
          | --- | --- | --- |
          | Debian, Ubuntu | `minv-linux-x64.deb` | `sudo apt install ./minv-linux-x64.deb` |
          | Fedora, RHEL, openSUSE | `minv-linux-x64.rpm` | `sudo dnf install ./minv-linux-x64.rpm` |
          | Any distribution | `minv-linux-x64.AppImage` | `chmod +x minv-linux-x64.AppImage && ./minv-linux-x64.AppImage` |
          | Any distribution | `minv-linux-x64.tar.gz` | `tar xzf minv-linux-x64.tar.gz && minv-linux-x64/bin/minv` |
          | Windows 10 and 11 | `minv-win32-x64-setup.exe` | Run it; installs for your user, no admin needed |
          | Windows, portable | `minv-win32-x64.zip` | Extract and run `Minv.exe` |

          Check a download with `sha256sum -c --ignore-missing SHA256SUMS`. You need Git installed. The Windows builds are unsigned, so SmartScreen asks before the first run: choose More info, then Run anyway.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Minv $version" --notes-file notes.md --generate-notes --verify-tag $prerelease
