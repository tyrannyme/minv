name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build, test and package (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/renderer/package-lock.json

      - name: Prepare runner
        run: |
          uname -r
          git --version
          # Electron's renderer sandbox needs unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix desktop/renderer --no-audit --no-fund

      - name: Fetch pinned Code-OSS source
        run: npm run upstream:fetch

      - name: Build
        run: npm run desktop:build

      - name: Type-check
        run: npm run check

      - name: Audit editor closure
        run: npm run editor:audit

      - name: Core tests
        run: npm test

      - name: Renderer tests
        run: npm --prefix desktop/renderer test

      - name: Desktop smoke
        run: node scripts/desktop-smoke.mjs

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke
          path: |
            build/desktop/smoke.json
            build/desktop/smoke.png
          if-no-files-found: ignore

      - name: Package
        run: npm run desktop:package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: minv-linux-x64
          path: |
            build/release/*.tar.gz
            build/release/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches package version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: minv-linux-x64
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Minv $VERSION" --generate-notes --verify-tag $prerelease
