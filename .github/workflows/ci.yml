name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build, smoke test and package (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbfile-dev libsecret-1-dev libkrb5-dev xvfb
          # Electron's renderer sandbox needs unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Prepare the fork
        run: node scripts/fork-prepare.mjs

      - name: Install upstream dependencies
        working-directory: .upstream/build
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: .upstream/build
        env:
          BUILD_SOURCEVERSION: ${{ github.sha }}
        run: npm run gulp vscode-linux-x64-min

      - name: Smoke test
        run: |
          mkdir -p build
          git init -q -b main /tmp/smoke && git -C /tmp/smoke -c user.name=ci -c user.email=ci@minv.invalid commit -q --allow-empty -m init
          node scripts/fork-capture.mjs /tmp/smoke build/smoke.png --app=.upstream/VSCode-linux-x64/minv --wait=8000 \
            --eval="document.querySelector('.statusbar')?.innerText" | tee build/smoke.log
          grep -q 'eval:.*main' build/smoke.log

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: build/smoke.*
          if-no-files-found: ignore

      - name: Package
        run: node scripts/fork-package.mjs

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: minv-linux-x64
          path: |
            build/release/*.tar.gz
            build/release/*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches package version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: minv-linux-x64
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Minv $VERSION" --generate-notes --verify-tag $prerelease
